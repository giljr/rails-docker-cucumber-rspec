default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "db") %>
  username: <%= ENV.fetch("DATABASE_USER", "app") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "app_dev") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "app_development") %>
test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_TEST_NAME", "app_test") %>
production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "app_production") %>